<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>PRAVDA</title>
    <script>
      (() => {
        const segments = window.location.pathname.split('/').filter(Boolean)
        const base = segments.length > 0 ? `/${segments[0]}` : '/'
        const redirectPath = window.location.pathname.substring(base === '/' ? 0 : base.length) + window.location.search + window.location.hash
        window.location.replace(`${window.location.origin}${base}/?redirect=${encodeURIComponent(redirectPath)}`)
      })()
    </script>
  </head>
  <body></body>
</html>
