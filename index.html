<!doctype html>
<html lang="ru" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="PRAVDA — Хроно, связи событий и доказательный AI-помощник для живого разговора." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>PRAVDA</title>
    <script type="module">
      (() => {
        const redirect = new URLSearchParams(window.location.search).get('redirect')
        if (!redirect) return

        const base = import.meta.env.BASE_URL === '/' ? '' : import.meta.env.BASE_URL.replace(/\/$/, '')
        const normalized = redirect.startsWith('/') ? redirect : `/${redirect}`
        window.history.replaceState(null, '', `${base}${normalized}`)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
